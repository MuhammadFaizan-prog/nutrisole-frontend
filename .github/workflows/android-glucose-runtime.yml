# Exercise an already-built APK in a fresh emulator, independently of the OCR
# instrumentation process. Both the APK source and smoke source are recorded.
name: Android glucose standalone UI

on:
  push:
    branches: [fix/glucose-live-inputs]
    paths: ['tests/glucose/android-smoke.mjs', '.github/workflows/android-glucose-runtime.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: android-glucose-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select the latest glucose APK artifact from this branch
        id: apk
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.request('GET /repos/{owner}/{repo}/actions/artifacts', { ...context.repo, per_page: 100 });
            const artifact = data.artifacts.find(a => !a.expired && a.name.startsWith('nutrisole-glucose-qa-apk-') && a.workflow_run?.head_branch === context.ref.replace('refs/heads/', ''));
            if (!artifact) throw new Error('No built glucose APK artifact exists on this branch');
            core.setOutput('id', artifact.id);
            core.setOutput('run', artifact.workflow_run.id);
            core.setOutput('source', artifact.workflow_run.head_sha);
            core.info(`APK source ${artifact.workflow_run.head_sha}, artifact ${artifact.id}`);
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.apk.outputs.id }}
          run-id: ${{ steps.apk.outputs.run }}
          github-token: ${{ github.token }}
          path: dist-qa
          merge-multiple: true
      - name: Verify APK checksums
        run: |
          (cd dist-qa && sha256sum -c *.sha256)
          mkdir -p dist-ui
          echo 'apk_source_commit=${{ steps.apk.outputs.source }}' > dist-ui/source.txt
          echo 'smoke_source_commit=${{ github.sha }}' >> dist-ui/source.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Standalone phone history, report picker, camera and routes
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NUTRISOLE_APK_SOURCE_SHA: ${{ steps.apk.outputs.source }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim
          disable-animations: true
          script: |
            adb install -r $(find dist-qa -maxdepth 1 -name 'nutrisole-glucose-qa-*.apk' -print -quit)
            node --experimental-strip-types --import ./tests/glucose/resolve-ts.mjs tests/glucose/android-smoke.mjs dist-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glucose-standalone-ui-${{ github.sha }}
          path: dist-ui/**
          retention-days: 30
