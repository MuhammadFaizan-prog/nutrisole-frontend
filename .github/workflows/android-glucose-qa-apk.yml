# Glucose QA APK (glucose branches only; never main, never deploy).
# - Release build with the JS bundle embedded (no Metro), signed with the committed DEBUG keystore; no secrets.
# - Default storage: encrypted on this phone. Optional Supabase account configuration
#   uses only public repository variables. Android OCR: bundled ML Kit.
# - arm64-v8a for phones and x86_64 for the emulator. Includes the instrumentation APK.
# - Artifact: nutrisole-glucose-qa-apk-<sha7> (APKs + .sha256 + build-info.txt).
# - Independent of the CV device workflow (cv-gauntlet-device); it touches no CV branch or model.
name: Android QA APK (glucose)

on:
  push:
    branches: [feature/glucose-monitoring, fix/glucose-live-inputs]
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: android-glucose-qa-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NUTRISOLE_GLUCOSE_STORAGE: phone
      SRC_SHA: ${{ github.sha }}
      BT: 36.0.0
      NUTRISOLE_SUPABASE_URL: ${{ vars.NUTRISOLE_SUPABASE_URL }}
      NUTRISOLE_SUPABASE_ANON_KEY: ${{ vars.NUTRISOLE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4

      - name: npm ci (root + native)
        run: |
          npm ci --no-audit --no-fund
          npm --prefix native ci --no-audit --no-fund

      - name: Glucose + native tests
        run: |
          npm run test:glucose
          npm --prefix native test

      - name: Write phone storage and optional public account config
        run: node scripts/write-native-env.mjs

      - name: Gradle phone/emulator APK and native instrumentation
        working-directory: native/android
        run: ./gradlew :app:assembleRelease :app:assembleDebugAndroidTest -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon --stacktrace

      - name: Inspect APK + sha256
        run: |
          set -euo pipefail
          sha7=${SRC_SHA:0:7}
          out=dist-qa; mkdir -p $out
          apk=$out/nutrisole-glucose-qa-${sha7}.apk
          cp native/android/app/build/outputs/apk/release/app-release.apk "$apk"
          cp native/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$out/nutrisole-glucose-tests-${sha7}.apk"
          aapt2="$ANDROID_HOME/build-tools/$BT/aapt2"
          rm -rf /tmp/apkx; mkdir -p /tmp/apkx; unzip -q "$apk" 'assets/index.android.bundle' -d /tmp/apkx
          {
            echo "source_commit=$SRC_SHA"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "apk=$(basename $apk) bytes=$(stat -c %s $apk)"
            echo "apk_sha256=$(sha256sum $apk | cut -d' ' -f1)"
            echo "== badging"; "$aapt2" dump badging "$apk"
            echo "== permissions"; "$aapt2" dump permissions "$apk"
            echo "== native libs"; unzip -l "$apk" | grep -E 'lib/(arm64-v8a|x86_64)/' || true
            echo "== glucose import markers in JS bundle (counts)"
            echo "storage_mode=$NUTRISOLE_GLUCOSE_STORAGE"
            for m in 'import-review' 'ble:gls' 'Health Connect' 'ML Kit Latin (on this phone)' 'Saved on this phone'; do echo "$m: $(grep -a -c "$m" /tmp/apkx/assets/index.android.bundle || true)"; done
            echo "== bundled OCR resources"; unzip -l "$apk" | grep -Ei 'mlkit|ocr' || true
          } | tee $out/build-info.txt
          (cd $out && sha256sum "$(basename $apk)" > "$(basename $apk).sha256")
          (cd $out && sha256sum "nutrisole-glucose-tests-${sha7}.apk" > "nutrisole-glucose-tests-${sha7}.apk.sha256")
          echo "SHA7=$sha7" >> "$GITHUB_ENV"
          perms=$("$aapt2" dump permissions "$apk")
          for p in android.permission.CAMERA android.permission.BLUETOOTH_SCAN android.permission.BLUETOOTH_CONNECT android.permission.health.READ_BLOOD_GLUCOSE; do
            echo "$perms" | grep -q "$p" || { echo "::error::$p missing"; exit 1; }
          done
          grep -a -q 'import-review' /tmp/apkx/assets/index.android.bundle || { echo "::error::import UI not in bundle"; exit 1; }
          grep -a -q 'ML Kit Latin (on this phone)' /tmp/apkx/assets/index.android.bundle || { echo "::error::Android reader not in bundle"; exit 1; }
          grep -a -q 'Saved on this phone' /tmp/apkx/assets/index.android.bundle || { echo "::error::phone history not in bundle"; exit 1; }
          if grep -a -q '"role":"service_role"' /tmp/apkx/assets/index.android.bundle; then echo "::error::service_role key in bundle"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: nutrisole-glucose-qa-apk-${{ env.SHA7 }}
          path: |
            dist-qa/*.apk
            dist-qa/*.sha256
            dist-qa/build-info.txt
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
